services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: finescrow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finescrow_admin
      POSTGRES_PASSWORD: finescrow_secret_2026
      POSTGRES_DB: finescrow_db
    ports:
      - "5432:5432"
    volumes:
      - finescrow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finescrow_admin -d finescrow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finescrow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - finescrow_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  finescrow_pgdata:
  finescrow_redisdata: