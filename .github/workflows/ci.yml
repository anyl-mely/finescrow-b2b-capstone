name: FinEscrow v1.0 CI Pipeline
on: [push, pull_request]

jobs:
  verify-backend-v1:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: finescrow_admin
          POSTGRES_PASSWORD: finescrow_secret_2026
          POSTGRES_DB: finescrow_db
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx vitest run